name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run validate

  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: lib
      - run: npm run build
        working-directory: lib
      - run: npm test
        working-directory: lib
      # simulator/lib/ is the committed freeze of lib/dist — byte identity
      # keeps the buildless simulators on the single library source
      - run: node scripts/build-simulator-lib.mjs --check
      # the vector generators that run on lib/dist must reproduce their
      # committed vectors byte for byte (the others run in npm run validate)
      - run: npm run check:generators:lib
      # the workbench carries its own copy so it also runs as a Claude Design
      # project; it must stay byte-identical to the freeze
      - run: diff -r simulator/lib apps/gesamtsimulator/lib
      # the simulator suites run AGAINST that frozen copy — they are the
      # workbench-level integration tests of lib/src
      - run: |
          cd simulator
          for t in rltp-crypto-test clock-test introduce-test trust-test \
                   groups-test continuity-test delivery-test graph-web-test; do
            node "$t.mjs"
          done
